<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Quiz Generator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/quiz_generator.css') }}">

</head>

<body>

<div class="page-wrapper">

    <div class="container" id="quizContainer">

        <!-- ========================= -->
        <!-- QUIZ FORM -->
        <!-- ========================= -->

        <div class="quiz-form">

            <div class="header-section" style="display: flex; justify-content: space-between; align-items: center;">

                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="icon-box">
                        ✦
                    </div>

                    <div>
                        <h1>AI Quiz Generator</h1>

                        <p>
                            Create intelligent quizzes using AI
                        </p>
                    </div>
                </div>

                <a href="/admin/dashboard" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; color: #fff; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);">
                    ← Admin Dashboard
                </a>

            </div>


            <!-- SUBJECT -->

            <div class="form-group">

                <label>Subject</label>

                <input
                    type="text"
                    id="subject"
                    list="subjectList"
                    placeholder="Select or type a subject">

                <datalist id="subjectList">

                    <option value="Java">
                    <option value="Python">
                    <option value="C">
                    <option value="C++">
                    <option value="DBMS">
                    <option value="Operating Systems">
                    <option value="Computer Networks">
                    <option value="Software Engineering">
                    <option value="Data Structures">
                    <option value="Algorithms">
                    <option value="Web Technologies">
                    <option value="Machine Learning">
                    <option value="Artificial Intelligence">
                    <option value="Cloud Computing">
                    <option value="Verbal">
                    <option value="Aptitude">

                </datalist>

            </div>


            <!-- TOPIC -->

            <div class="form-group">

                <label>Topic</label>

                <input
                    type="text"
                    id="topic"
                    placeholder="Example: OOP, JDBC, Normalization">

            </div>


            <!-- DIFFICULTY -->

            <div class="form-group">

                <label>Difficulty</label>

                <div class="difficulty-options">

                    <input
                        type="radio"
                        id="easy"
                        name="difficulty"
                        value="Easy">

                    <label for="easy">
                        Easy
                    </label>


                    <input
                        type="radio"
                        id="medium"
                        name="difficulty"
                        value="Medium"
                        checked>

                    <label for="medium">
                        Medium
                    </label>


                    <input
                        type="radio"
                        id="hard"
                        name="difficulty"
                        value="Hard">

                    <label for="hard">
                        Hard
                    </label>

                </div>

            </div>


            <!-- NUMBER OF QUESTIONS -->

            <div class="form-group">

                <label>Number of Questions</label>

                <input
                    type="number"
                    id="count"
                    min="1"
                    max="150"
                    value="10"
                    placeholder="Enter number of questions">

            </div>


            <!-- DURATION -->

            <div class="form-group">

                <label>Duration (Minutes)</label>

                <input
                    type="number"
                    id="duration"
                    min="5"
                    max="300"
                    value="30"
                    class="form-control">

            </div>


            <!-- START TIME -->

            <div class="form-group">

                <label>Available From</label>

                <input
                    type="datetime-local"
                    id="startTime">

            </div>


            <!-- END TIME -->

            <div class="form-group">

                <label>Available Until</label>

                <input
                    type="datetime-local"
                    id="endTime">

            </div>


            <!-- GENERATE -->

            <button id="generateBtn">

                <span>✦</span>
                Generate Quiz

            </button>

        </div>


        <!-- ========================= -->
        <!-- QUIZ PREVIEW -->
        <!-- ========================= -->

        <div id="quizPreview">

            <div class="preview-header">

                <div>

                    <h2>AI Generated Quiz</h2>

                    <p>
                        Review the generated questions
                    </p>

                </div>

                <div class="ai-badge">
                    AI Generated
                </div>

            </div>


            <!-- ONLY THIS AREA SCROLLS -->

            <div id="questionsContainer"
                 class="questions-scroll">

                <!-- Generated questions appear here -->

            </div>


            <!-- SAVE BUTTON OUTSIDE SCROLL -->

            <div class="save-section">

                <button
                    id="saveQuizBtn"
                    class="btn btn-success">

                    ✓ Save Quiz

                </button>

            </div>

        </div>

    </div>

</div>


<script src="{{ url_for('static', filename='js/quiz_generator.js') }}"></script>

</body>

</html>
